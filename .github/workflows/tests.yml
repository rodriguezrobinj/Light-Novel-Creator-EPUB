name: Tests

on:
  pull_request:
  push:
    branches: [master]

# Un push nuevo a la misma rama cancela la ejecución vieja
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # test_convert.py pone QT_QPA_PLATFORM=offscreen y LNC_SIN_CHROMIUM=1 por su cuenta
      - run: python test_convert.py
