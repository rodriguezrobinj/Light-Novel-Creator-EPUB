name: Tests

on:
  pull_request:
  push:
    branches: [master]

# Un push nuevo a la misma rama cancela la ejecución vieja
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Revisión rápida (~15 s): atrapa errores estáticos y CVE antes de esperar a Windows
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Instalar herramientas de análisis
        run: python -m pip install --upgrade ruff pip-audit
      - name: Análisis estático (Ruff)
        run: ruff check .
      - name: Auditoría de vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements.txt

  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # test_convert.py pone QT_QPA_PLATFORM=offscreen y LNC_SIN_CHROMIUM=1 por su cuenta
      - run: python test_convert.py
