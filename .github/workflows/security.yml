name: Seguridad

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Escaneo semanal: detecta nuevas vulnerabilidades en PyMuPDF, Pillow o PySide6 aunque no haya commits
  schedule:
    - cron: "27 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip-audit
      - run: pip-audit -r requirements.txt

# CodeQL no va aquí: el repositorio lo tiene en «configuración por defecto» de GitHub, y con ella activa
# un análisis avanzado desde un workflow falla siempre
