name: Comprobar ejecutable

on:
  pull_request:
    branches: [master]
    paths:
      - "requirements.txt"
      - "PDF a EPUB.spec"
      - "app.py"
      - "webview.py"
      - "websheet.py"
      - "qtk.py"
      - "theme.py"
      - "updater.py"
      - "fonts/**"
      - "dict/**"
      - "tessdata/**"
      - "icon.ico"
      - "installer/**"
  workflow_dispatch:

# Evita compilar dos builds viejos en paralelo en el mismo PR
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-exe:
    name: Compilar .exe y verificar Chromium
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compilar con PyInstaller
        run: python -m PyInstaller --noconfirm "PDF a EPUB.spec"
      - name: Comprobar Chromium en el .exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $r = Join-Path $env:RUNNER_TEMP "chromium.txt"
          $p = Start-Process "dist\Light Novel Creator\PDF a EPUB.exe" -ArgumentList "--comprobar-chromium", "`"$r`"" -PassThru -Wait
          $out = Get-Content $r -Encoding utf8 -ErrorAction SilentlyContinue
          "codigo=$($p.ExitCode) $out"
          if ($p.ExitCode -ne 0 -or -not ("$out" -match '^ok')) { exit 1 }
      - name: Arranque de humo del .exe
        timeout-minutes: 5
        shell: pwsh
        run: |
          $p = Start-Process "dist\Light Novel Creator\PDF a EPUB.exe" -PassThru
          $t = 0
          while ($t -lt 35 -and -not $p.HasExited -and -not (Get-Process -Name "PDF a EPUB" -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle })) {
            Start-Sleep 1
            $t++
          }
          $alive = -not $p.HasExited
          $title = (Get-Process -Name "PDF a EPUB" -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle } | Select-Object -First 1 -ExpandProperty MainWindowTitle)
          Get-Process -Name "PDF a EPUB" -ErrorAction SilentlyContinue | ForEach-Object { [void]$_.CloseMainWindow() }
          Start-Sleep 4
          Stop-Process -Name "PDF a EPUB" -Force -ErrorAction SilentlyContinue
          "vivo=$alive segundos=$t titulo=$title"
          if (-not $alive) { exit 1 }
